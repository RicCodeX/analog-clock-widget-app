name: Build Analog Clock APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/richard/analogclock
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable-nodpi

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AnalogClock"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.richard.analogclock"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.richard.analogclock"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Analog Clock"
                  android:icon="@drawable/dial"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ClockWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/clock_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/richard/analogclock/ClockWidget.java <<'EOF'
          package com.richard.analogclock;

          import android.appwidget.AppWidgetProvider;

          public class ClockWidget extends AppWidgetProvider {
          }
          EOF

          cat > app/src/main/java/com/richard/analogclock/MainActivity.java <<'EOF'
          package com.richard.analogclock;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView t = new TextView(this);
                  t.setText("Analog Clock is installed.\n\nTo add it: long-press your home screen, tap Widgets, find Analog Clock, and drag it onto your screen.");
                  t.setTextSize(18);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(60, 60, 60, 60);
                  setContentView(t);
              }
          }
          EOF

          cat > app/src/main/res/xml/clock_widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:minResizeWidth="40dp"
              android:minResizeHeight="40dp"
              android:resizeMode="horizontal|vertical"
              android:initialLayout="@layout/widget_clock"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen" />
          EOF

          cat > app/src/main/res/layout/widget_clock.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <AnalogClock
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center"
                  android:dial="@drawable/dial"
                  android:hand_hour="@drawable/hand_hour"
                  android:hand_minute="@drawable/hand_minute"
                  android:hand_second="@drawable/hand_second" />
          </FrameLayout>
          EOF

      - name: Draw clock face and hands
        run: |
          pip install pillow
          curl -fsSL -o Poppins-Medium.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Medium.ttf || true
          python3 - <<'PY'
          import math, os
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          S = 1600
          C = S // 2
          OUT = 'app/src/main/res/drawable-nodpi'
          os.makedirs(OUT, exist_ok=True)

          WHITE = (242, 242, 242, 255)
          RED = (255, 69, 58, 255)
          FACE_EDGE = (10, 10, 12)
          FACE_MID = (38, 38, 43)


          def save(img, name):
              img.resize((800, 800), Image.LANCZOS).save(f'{OUT}/{name}.png')


          def lerp(a, b, t):
              return tuple(int(a[i] + (b[i] - a[i]) * t) for i in range(len(a)))


          def load_font(size):
              for p in ('Poppins-Medium.ttf',
                        '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'):
                  try:
                      return ImageFont.truetype(p, size)
                  except Exception:
                      pass
              return ImageFont.load_default(size=size)


          # ---------- Dial ----------
          img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)

          R_OUT, R_BEZ = 790, 745
          for r in range(R_OUT, R_BEZ, -1):
              t = (R_OUT - r) / (R_OUT - R_BEZ)
              d.ellipse([C - r, C - r, C + r, C + r],
                        fill=lerp((240, 240, 244), (105, 105, 114), t) + (255,))

          d.ellipse([C - R_BEZ, C - R_BEZ, C + R_BEZ, C + R_BEZ], fill=(0, 0, 0, 255))

          R_FACE = R_BEZ - 8
          for r in range(R_FACE, 0, -2):
              t = ((R_FACE - r) / R_FACE) ** 1.2
              d.ellipse([C - r, C - r, C + r, C + r],
                        fill=lerp(FACE_EDGE, FACE_MID, t) + (255,))

          for i in range(60):
              a = math.radians(i * 6)
              big = (i % 5 == 0)
              r1 = 712
              r2 = r1 - (62 if big else 26)
              w = 15 if big else 6
              d.line([C + r1 * math.sin(a), C - r1 * math.cos(a),
                      C + r2 * math.sin(a), C - r2 * math.cos(a)],
                     fill=WHITE, width=w)

          font = load_font(140)
          for n in range(1, 13):
              a = math.radians(n * 30)
              r = 520
              s = str(n)
              bb = d.textbbox((0, 0), s, font=font)
              w, h = bb[2] - bb[0], bb[3] - bb[1]
              x = C + r * math.sin(a) - w / 2 - bb[0]
              y = C - r * math.cos(a) - h / 2 - bb[1]
              d.text((x, y), s, font=font, fill=WHITE)

          save(img, 'dial')


          # ---------- Hands ----------
          def make_hand(name, shapes, color, dot=None):
              layer = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              dl = ImageDraw.Draw(layer)
              mask = Image.new('L', (S, S), 0)
              dm = ImageDraw.Draw(mask)
              for kind, data in shapes:
                  if kind == 'poly':
                      pts = [(C + x, C + y) for x, y in data]
                      dl.polygon(pts, fill=color)
                      dm.polygon(pts, fill=255)
                  else:
                      cx, cy, r = data
                      box = [C + cx - r, C + cy - r, C + cx + r, C + cy + r]
                      dl.ellipse(box, fill=color)
                      dm.ellipse(box, fill=255)
              shadow = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              shadow.putalpha(mask.filter(ImageFilter.GaussianBlur(14)).point(lambda v: int(v * 0.6)))
              out = Image.alpha_composite(shadow, layer)
              if dot:
                  ImageDraw.Draw(out).ellipse([C - dot, C - dot, C + dot, C + dot], fill=(18, 18, 20, 255))
              save(out, name)


          def blade(hw, length, tail):
              return ('poly', [(-hw * 0.55, tail), (-hw, 0), (-hw * 0.8, -length * 0.72),
                               (0, -length), (hw * 0.8, -length * 0.72), (hw, 0),
                               (hw * 0.55, tail)])


          make_hand('hand_hour', [blade(30, 420, 110)], WHITE)
          make_hand('hand_minute', [blade(21, 660, 130)], WHITE)
          make_hand('hand_second', [
              ('poly', [(-6, 210), (-7, 0), (0, -720), (7, 0), (6, 210)]),
              ('circle', (0, 150, 30)),
              ('circle', (0, 0, 42)),
          ], RED, dot=14)
          PY

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AnalogClock.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Analog Clock v${{ github.run_number }}
          files: AnalogClock.apk
