name: Build Analog Clock APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/richard/analogclock app/src/main/res/layout app/src/main/res/xml app/src/main/res/drawable app/src/main/res/drawable-nodpi

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AnalogClock"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.richard.analogclock"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.richard.analogclock"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Analog Clock"
                  android:icon="@drawable/preview_classic"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ClassicWidget"
                      android:label="Clock: Classic"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/classic_info" />
                  </receiver>

                  <receiver
                      android:name=".DateWidget"
                      android:label="Clock: Date"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.intent.action.DATE_CHANGED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/date_info" />
                  </receiver>

                  <receiver
                      android:name=".BlueWidget"
                      android:label="Clock: Blue"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/blue_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/richard/analogclock/ClassicWidget.java <<'EOF'
          package com.richard.analogclock;

          import android.appwidget.AppWidgetProvider;

          public class ClassicWidget extends AppWidgetProvider {
          }
          EOF

          cat > app/src/main/java/com/richard/analogclock/DateWidget.java <<'EOF'
          package com.richard.analogclock;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          import java.util.Calendar;

          public class DateWidget extends AppWidgetProvider {

              private static final String ACTION_MIDNIGHT = "com.richard.analogclock.MIDNIGHT";

              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] ids) {
                  refresh(context, manager, ids);
                  scheduleMidnight(context);
              }

              @Override
              public void onEnabled(Context context) {
                  scheduleMidnight(context);
              }

              @Override
              public void onDisabled(Context context) {
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  am.cancel(midnightIntent(context));
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  String action = intent.getAction();
                  if (ACTION_MIDNIGHT.equals(action)
                          || Intent.ACTION_DATE_CHANGED.equals(action)
                          || Intent.ACTION_TIME_CHANGED.equals(action)
                          || Intent.ACTION_TIMEZONE_CHANGED.equals(action)) {
                      AppWidgetManager manager = AppWidgetManager.getInstance(context);
                      int[] ids = manager.getAppWidgetIds(new ComponentName(context, DateWidget.class));
                      refresh(context, manager, ids);
                      scheduleMidnight(context);
                  }
              }

              private static void refresh(Context context, AppWidgetManager manager, int[] ids) {
                  Calendar now = Calendar.getInstance();
                  int dayOfWeek = now.get(Calendar.DAY_OF_WEEK) - 1; // 0 = Sunday
                  int dayOfMonth = now.get(Calendar.DAY_OF_MONTH);
                  String pkg = context.getPackageName();
                  int dayRes = context.getResources().getIdentifier("day_" + dayOfWeek, "drawable", pkg);
                  int dateRes = context.getResources().getIdentifier("date_" + dayOfMonth, "drawable", pkg);
                  for (int id : ids) {
                      RemoteViews views = new RemoteViews(pkg, R.layout.widget_date);
                      if (dayRes != 0) {
                          views.setImageViewResource(R.id.day_overlay, dayRes);
                      }
                      if (dateRes != 0) {
                          views.setImageViewResource(R.id.date_overlay, dateRes);
                      }
                      manager.updateAppWidget(id, views);
                  }
              }

              private static PendingIntent midnightIntent(Context context) {
                  Intent intent = new Intent(context, DateWidget.class).setAction(ACTION_MIDNIGHT);
                  return PendingIntent.getBroadcast(context, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static void scheduleMidnight(Context context) {
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  Calendar next = Calendar.getInstance();
                  next.add(Calendar.DAY_OF_YEAR, 1);
                  next.set(Calendar.HOUR_OF_DAY, 0);
                  next.set(Calendar.MINUTE, 0);
                  next.set(Calendar.SECOND, 5);
                  next.set(Calendar.MILLISECOND, 0);
                  am.set(AlarmManager.RTC, next.getTimeInMillis(), midnightIntent(context));
              }
          }
          EOF

          cat > app/src/main/java/com/richard/analogclock/BlueWidget.java <<'EOF'
          package com.richard.analogclock;

          import android.appwidget.AppWidgetProvider;

          public class BlueWidget extends AppWidgetProvider {
          }
          EOF

          cat > app/src/main/java/com/richard/analogclock/MainActivity.java <<'EOF'
          package com.richard.analogclock;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView t = new TextView(this);
                  t.setText("Analog Clock is installed.\n\nTo add a clock: long-press your home screen, tap Widgets, find Analog Clock, and choose one of the three looks: Classic, Date or Blue.");
                  t.setTextSize(18);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(60, 60, 60, 60);
                  setContentView(t);
              }
          }
          EOF

          cat > app/src/main/res/drawable/date_clear.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#00000000" />
              <size
                  android:width="1000px"
                  android:height="1000px" />
          </shape>
          EOF

          cat > app/src/main/res/xml/classic_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:minResizeWidth="40dp"
              android:minResizeHeight="40dp"
              android:resizeMode="horizontal|vertical"
              android:previewImage="@drawable/preview_classic"
              android:initialLayout="@layout/widget_classic"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen" />
          EOF

          cat > app/src/main/res/xml/date_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="180dp"
              android:targetCellWidth="3"
              android:targetCellHeight="3"
              android:resizeMode="none"
              android:previewImage="@drawable/preview_date"
              android:initialLayout="@layout/widget_date"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          EOF

          cat > app/src/main/res/xml/blue_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:minResizeWidth="40dp"
              android:minResizeHeight="40dp"
              android:resizeMode="horizontal|vertical"
              android:previewImage="@drawable/preview_blue"
              android:initialLayout="@layout/widget_blue"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen" />
          EOF

          cat > app/src/main/res/layout/widget_classic.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <AnalogClock
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center"
                  android:dial="@drawable/classic_dial"
                  android:hand_hour="@drawable/classic_hour"
                  android:hand_minute="@drawable/classic_min"
                  android:hand_second="@drawable/classic_sec" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/widget_date.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <ImageView
                  android:id="@+id/date_face"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="centerInside"
                  android:src="@drawable/date_dial" />

              <ImageView
                  android:id="@+id/day_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="centerInside"
                  android:src="@drawable/day_1" />

              <ImageView
                  android:id="@+id/date_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="centerInside"
                  android:src="@drawable/date_1" />

              <AnalogClock
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center"
                  android:dial="@drawable/date_clear"
                  android:hand_hour="@drawable/date_hour"
                  android:hand_minute="@drawable/date_min"
                  android:hand_second="@drawable/date_sec" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/widget_blue.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <AnalogClock
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center"
                  android:dial="@drawable/blue_dial"
                  android:hand_hour="@drawable/blue_hour"
                  android:hand_minute="@drawable/blue_min"
                  android:hand_second="@drawable/blue_sec" />
          </FrameLayout>
          EOF

      - name: Draw clock faces and hands
        run: |
          pip install pillow
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o Lato-Bold.ttf $B/lato/Lato-Bold.ttf || true
          curl -fsSL -o Michroma-Regular.ttf $B/michroma/Michroma-Regular.ttf || true
          curl -fsSL -o URWGothic-Book.otf https://raw.githubusercontent.com/ArtifexSoftware/urw-base35-fonts/master/fonts/URWGothic-Book.otf || true
          python3 - <<'PY'
          import math, os
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageChops

          S = 1600
          C = S // 2
          OUT = 'app/src/main/res/drawable-nodpi'
          os.makedirs(OUT, exist_ok=True)

          WHITE = (242, 242, 242, 255)
          PURE = (255, 255, 255, 255)
          RED = (255, 69, 58, 255)
          SILVER = (208, 212, 218, 255)


          def save(img, name, size=800):
              img.resize((size, size), Image.LANCZOS).save(f'{OUT}/{name}.png')


          def lerp(a, b, t):
              return tuple(int(a[i] + (b[i] - a[i]) * t) for i in range(len(a)))


          def load_font(files, size):
              for p in files + ['/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf']:
                  try:
                      return ImageFont.truetype(p, size)
                  except Exception:
                      pass
              return ImageFont.load_default(size=size)


          def disc(d, r, fill):
              d.ellipse([C - r, C - r, C + r, C + r], fill=fill)


          def put_number(d, s, cx, cy, font, fill, stroke=0):
              bb = d.textbbox((0, 0), s, font=font, stroke_width=stroke)
              w, h = bb[2] - bb[0], bb[3] - bb[1]
              d.text((cx - w / 2 - bb[0], cy - h / 2 - bb[1]), s, font=font, fill=fill,
                     stroke_width=stroke, stroke_fill=fill)


          def polar(r, deg):
              a = math.radians(deg)
              return C + r * math.sin(a), C - r * math.cos(a)


          # ---------- Dials ----------
          def classic_dial():
              img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              R_OUT, R_BEZ = 790, 745
              for r in range(R_OUT, R_BEZ, -1):
                  t = (R_OUT - r) / (R_OUT - R_BEZ)
                  disc(d, r, lerp((240, 240, 244), (105, 105, 114), t) + (255,))
              disc(d, R_BEZ, (0, 0, 0, 255))
              R_FACE = R_BEZ - 8
              for r in range(R_FACE, 0, -2):
                  t = ((R_FACE - r) / R_FACE) ** 1.2
                  disc(d, r, lerp((10, 10, 12), (38, 38, 43), t) + (255,))
              for i in range(60):
                  big = (i % 5 == 0)
                  r1 = 712
                  r2 = r1 - (62 if big else 26)
                  d.line([polar(r1, i * 6), polar(r2, i * 6)], fill=WHITE, width=15 if big else 6)
              font = load_font(['Lato-Bold.ttf'], 165)
              for n in range(1, 13):
                  x, y = polar(515, n * 30)
                  put_number(d, str(n), x, y, font, WHITE)
              return img


          AG = ['URWGothic-Book.otf']
          TEXT = (20, 20, 22, 255)
          DATE_CX = C + 505          # centre of the date window (3 o'clock)
          DAY_RC, DAY_HH, DAY_A = 598, 38, 22   # curved day window: radius, half height, half angle


          def window(d, x0, x1, y0, y1, shade):
              for i in range(10):
                  d.rounded_rectangle([x0 - 10 + i, y0 - 10 + i, x1 + 10 - i, y1 + 10 - i],
                                      radius=22 - i,
                                      fill=lerp((236, 236, 240), (120, 120, 128), i / 9) + (255,))
              d.rounded_rectangle([x0, y0, x1, y1], radius=10, fill=(248, 248, 245, 255))
              for i in range(shade):
                  d.line([x0 + 8, y0 + i, x1 - 8, y0 + i],
                         fill=lerp((196, 196, 200), (248, 248, 245), i / shade) + (255,))


          def arc_pts(r, a0, a1, n=48):
              return [polar(r, a0 + (a1 - a0) * k / n) for k in range(n + 1)]


          def curved_window(d, rc, hh, A):
              r_in, r_out = rc - hh, rc + hh
              for i in range(10):
                  m = 10 - i
                  a = A + math.degrees(m / rc)
                  d.polygon(arc_pts(r_out + m, -a, a) + arc_pts(r_in - m, a, -a),
                            fill=lerp((236, 236, 240), (120, 120, 128), i / 9) + (255,))
              d.polygon(arc_pts(r_out, -A, A) + arc_pts(r_in, A, -A), fill=(248, 248, 245, 255))
              for k in range(10):
                  d.line(arc_pts(r_out - 1 - k, -A + 1.2, A - 1.2),
                         fill=lerp((196, 196, 200), (248, 248, 245), k / 10) + (255,), width=2)


          def date_dial():
              img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              R_OUT, R_BEZ = 790, 745
              for r in range(R_OUT, R_BEZ, -1):
                  t = (R_OUT - r) / (R_OUT - R_BEZ)
                  disc(d, r, lerp((240, 240, 244), (105, 105, 114), t) + (255,))
              disc(d, R_BEZ, (0, 0, 0, 255))
              R_FACE = R_BEZ - 8
              for r in range(R_FACE, 0, -2):
                  t = ((R_FACE - r) / R_FACE) ** 1.2
                  disc(d, r, lerp((10, 10, 12), (38, 38, 43), t) + (255,))
              for i in range(1, 60):            # no tick at 12: the day window sits there
                  big = (i % 5 == 0)
                  r1 = 712
                  r2 = r1 - (62 if big else 26)
                  d.line([polar(r1, i * 6), polar(r2, i * 6)], fill=WHITE, width=15 if big else 6)
              font = load_font(AG, 150)
              for n in range(1, 13):
                  if n in (3, 12):
                      continue
                  x, y = polar(498, n * 30)
                  put_number(d, str(n), x, y, font, WHITE, stroke=2)
              window(d, DATE_CX - 110, DATE_CX + 110, C - 95, C + 95, 14)
              curved_window(d, DAY_RC, DAY_HH, DAY_A)
              return img


          def day_overlay(text):
              layer = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              font = load_font(AG, 54)
              spacing = 6
              adv = [font.getlength(ch) for ch in text]
              total = sum(adv) + spacing * (len(text) - 1)
              cap = font.getbbox('H')[3] - font.getbbox('H')[1]
              pos = -total / 2
              for ch, w in zip(text, adv):
                  ang = math.degrees((pos + w / 2) / DAY_RC)
                  pos += w + spacing
                  g = Image.new('RGBA', (240, 240), (0, 0, 0, 0))
                  ImageDraw.Draw(g).text((120, 120 + cap / 2), ch, font=font, fill=TEXT,
                                         anchor='ms', stroke_width=1, stroke_fill=TEXT)
                  g = g.rotate(-ang, resample=Image.BICUBIC)
                  x, y = polar(DAY_RC, ang)
                  layer.alpha_composite(g, (int(round(x - 120)), int(round(y - 120))))
              return layer


          def date_overlay(n):
              layer = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              put_number(ImageDraw.Draw(layer), str(n), DATE_CX, C, load_font(AG, 135), TEXT, stroke=2)
              return layer


          def blue_dial():
              img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              R_OUT, R_BEZ = 790, 738
              for r in range(R_OUT, R_BEZ, -1):
                  t = (R_OUT - r) / (R_OUT - R_BEZ)
                  disc(d, r, lerp((62, 108, 160), (14, 34, 70), t) + (255,))
              R_FACE = R_BEZ - 4
              for r in range(R_FACE, 0, -2):
                  t = ((R_FACE - r) / R_FACE) ** 1.3
                  disc(d, r, lerp((20, 66, 102), (38, 104, 142), t) + (255,))
              # glass reflection: soft crescent at the top left
              m1 = Image.new('L', (S, S), 0)
              ImageDraw.Draw(m1).ellipse([C - R_FACE, C - R_FACE, C + R_FACE, C + R_FACE], fill=255)
              m2 = Image.new('L', (S, S), 0)
              ImageDraw.Draw(m2).ellipse([C - R_FACE + 150, C - R_FACE + 170,
                                          C + R_FACE + 150, C + R_FACE + 170], fill=255)
              cres = ImageChops.multiply(ImageChops.subtract(m1, m2).filter(ImageFilter.GaussianBlur(24)), m1).point(lambda v: int(v * 0.0008 * 255 * 0.55)) if False else ImageChops.multiply(ImageChops.subtract(m1, m2).filter(ImageFilter.GaussianBlur(24)), m1).point(lambda v: int(v * v / 255 * 0.14))
              glow = Image.new('RGBA', (S, S), (255, 255, 255, 0))
              glow.putalpha(cres)
              img = Image.alpha_composite(img, glow)
              d = ImageDraw.Draw(img)
              for i in range(60):
                  big = (i % 5 == 0)
                  r1 = 712
                  r2 = r1 - (44 if big else 26)
                  d.line([polar(r1, i * 6), polar(r2, i * 6)], fill=PURE, width=11 if big else 6)
              font = load_font(['Michroma-Regular.ttf'], 118)
              for n in range(1, 13):
                  x, y = polar(500, n * 30)
                  put_number(d, str(n), x, y, font, PURE, stroke=5)
              return img


          # ---------- Hands ----------
          def make_hand(shapes, dot=None):
              layer = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              dl = ImageDraw.Draw(layer)
              mask = Image.new('L', (S, S), 0)
              dm = ImageDraw.Draw(mask)
              for kind, data, color in shapes:
                  if kind == 'poly':
                      pts = [(C + x, C + y) for x, y in data]
                      dl.polygon(pts, fill=color)
                      dm.polygon(pts, fill=255)
                  else:
                      cx, cy, r = data
                      box = [C + cx - r, C + cy - r, C + cx + r, C + cy + r]
                      dl.ellipse(box, fill=color)
                      dm.ellipse(box, fill=255)
              shadow = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              shadow.putalpha(mask.filter(ImageFilter.GaussianBlur(14)).point(lambda v: int(v * 0.6)))
              out = Image.alpha_composite(shadow, layer)
              if dot:
                  r, col = dot
                  ImageDraw.Draw(out).ellipse([C - r, C - r, C + r, C + r], fill=col)
              return out


          def needle(hw, length, tail, color):
              # widest at the hub, one straight taper to a sharp point
              return ('poly', [(-hw * 0.6, tail), (-hw, 0), (0, -length), (hw, 0), (hw * 0.6, tail)], color)


          def bar(hw, length, tail, color):
              return ('poly', [(-hw, tail), (-hw, -length + hw * 1.6), (0, -length),
                               (hw, -length + hw * 1.6), (hw, tail)], color)


          classic_hour = make_hand([needle(32, 430, 110, WHITE)])
          classic_min = make_hand([needle(22, 670, 130, WHITE)])
          classic_sec = make_hand([
              ('poly', [(-6, 210), (-7, 0), (0, -730), (7, 0), (6, 210)], RED),
              ('circle', (0, 150, 30), RED),
              ('circle', (0, 0, 42), RED),
          ], dot=(14, (18, 18, 20, 255)))

          blue_hour = make_hand([bar(26, 430, 90, PURE)])
          blue_min = make_hand([bar(18, 660, 110, PURE)])
          blue_sec = make_hand([
              ('poly', [(-4, 250), (-4, -700), (0, -745), (4, -700), (4, 250)], PURE),
              ('circle', (0, 0, 46), SILVER),
          ], dot=(16, (110, 116, 126, 255)))

          # ---------- Save the artwork ----------
          d_classic = classic_dial()
          d_blue = blue_dial()
          save(d_classic, 'classic_dial')
          save(d_blue, 'blue_dial')
          for name, img in (('classic_hour', classic_hour), ('classic_min', classic_min),
                            ('classic_sec', classic_sec), ('blue_hour', blue_hour),
                            ('blue_min', blue_min), ('blue_sec', blue_sec)):
              save(img, name)

          # Date look: 1000 px artwork, window text swapped by day
          d_date = date_dial()
          save(d_date, 'date_dial', 1000)
          save(classic_hour, 'date_hour', 1000)
          save(classic_min, 'date_min', 1000)
          save(classic_sec, 'date_sec', 1000)
          DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY']
          for i, name in enumerate(DAYS):
              save(day_overlay(name), f'day_{i}', 1000)
          for n in range(1, 32):
              save(date_overlay(n), f'date_{n}', 1000)


          # ---------- Previews for the widget picker (clock at 10:10:30) ----------
          def preview(name, dial, hands, overlays=()):
              base = dial
              for ov in overlays:
                  base = Image.alpha_composite(base, ov)
              base = base.resize((800, 800), Image.LANCZOS)
              for hand_img, deg in zip(hands, (10 * 30 + 5, 10 * 6 + 3, 30 * 6)):
                  h = hand_img.resize((800, 800), Image.LANCZOS).rotate(-deg, resample=Image.BICUBIC)
                  base = Image.alpha_composite(base, h)
              base.resize((400, 400), Image.LANCZOS).save(f'{OUT}/preview_{name}.png')
              return base


          preview('classic', d_classic, (classic_hour, classic_min, classic_sec))
          preview('date', d_date, (classic_hour, classic_min, classic_sec),
                  (day_overlay('MONDAY'), date_overlay(19)))
          preview('blue', d_blue, (blue_hour, blue_min, blue_sec))
          PY

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AnalogClock.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Analog Clock v${{ github.run_number }}
          files: AnalogClock.apk
